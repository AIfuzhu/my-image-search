name: 云端自动编译 Windows EXE 软件

on:
  workflow_dispatch: # 支持你随时在网页上手动点击按钮触发打包

jobs:
  build_exe:
    runs-on: windows-latest # 开启微软原生 Windows 虚拟机保证环境绝对纯正

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装本地 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. 部署打包依赖库
      run: |
        python -m pip install --upgrade pip
        pip install pillow imagehash pyinstaller

    - name: 4. 执行 PyInstaller 独立封装
      run: |
        pyinstaller --onefile --name="12600KF狂暴检索工具" fast_search.py

    - name: 5. 导出并递交打包好的 EXE 产物
      uses: actions/upload-artifact@v4
      with:
        name: Image-Search-Tool-Windows
        path: dist/12600KF狂暴检索工具.exe
